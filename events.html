<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TMF Night Carnival - Ивенты</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Базовые настройки */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0a0b0c;
            color: #ffffff;
            line-height: 1.6;
            overflow-x: hidden;
            background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 1px, transparent 1px, transparent 30px);
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 0 40px;
        }

        /* --- HEADER --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 40px;
            position: absolute;
            width: 100%;
            top: 0;
            z-index: 10;
            background: rgba(10, 11, 12, 0.7);
            backdrop-filter: blur(5px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        .nav-links {
            display: flex;
            gap: 50px;
            margin: 0 auto;
        }

        .nav-links a {
            font-weight: 600;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 0.1em;
            color: rgba(255,255,255,0.7);
            transition: color 0.3s;
        }

        .nav-links a:hover {
            color: #fff;
        }

        .social-icons {
            display: flex;
            gap: 15px;
        }

        .social-icons a {
            background: rgba(255,255,255,0.05);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: 0.3s;
        }

        .social-icons a:hover {
            background: rgba(255,255,255,0.15);
        }

        /* --- HERO SECTION (Ивенты) --- */
        .hero {
            min-height: 80vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            position: relative;
            padding-top: 120px;
            padding-bottom: 40px;
            
            /* ФОН: Убраны градиентные полосы сверху и снизу. 
               Вставьте сюда вашу картинку, если она есть */
            background-color: #0a0b0c;
            background-image: url('10.gif');
            background-size: cover;
            background-position: center;
        }

        /* Герой полностью чист от полос, только легкое затемнение для читаемости текста */
        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 11, 12, 0.6); /* Без градиентов, просто затемнение */
            z-index: 1;
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }

        .hero h1 {
            font-size: 60px;
            font-weight: 700;
            letter-spacing: 0.1em;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        .hero p {
            font-size: 12px;
            letter-spacing: 0.1em;
            font-weight: 300;
            max-width: 500px;
            margin: 0 auto 40px;
            line-height: 1.8;
            text-transform: uppercase;
            color: #d0d0d0;
        }

        /* Кнопка для добавления ивентов */
        .btn-add-event {
            display: inline-block;
            padding: 15px 60px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-size: 16px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            transition: all 0.3s;
            cursor: pointer;
        }

        .btn-add-event:hover {
            background: #fff;
            color: #0a0b0c;
        }

        /* --- GRID SECTION (Сетка с карточками) --- */
        .section-events {
            padding: 60px 0 100px;
            position: relative;
            z-index: 2;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 30px;
        }

        /* Стили для карточки, которую создает JS */
        .event-card {
            background: transparent;
            border: 1px solid #ffffff;
            padding: 30px 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 250px;
        }

        .event-card h3 {
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 15px;
            font-weight: 600;
        }

        .event-card p {
            font-size: 13px;
            line-height: 1.6;
            text-transform: uppercase;
            color: #e0e0e0;
            margin-bottom: 30px;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #a0a0a0;
            margin-top: auto;
        }

        /* Адаптив для сетки */
        @media (max-width: 900px) {
            .events-grid {
                grid-template-columns: 1fr;
            }
        }

        /* --- FOOTER --- */
        footer {
            border-top: 1px solid rgba(255,255,255,0.05);
            padding: 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #070809;
        }

        .footer-text {
            font-size: 10px;
            text-transform: uppercase;
            line-height: 1.6;
            color: #a0a0a0;
            letter-spacing: 0.05em;
        }

        .btn-dev {
            padding: 12px 30px;
            border: 1px solid #fff;
            background: transparent;
            color: #fff;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.1em;
            transition: 0.3s;
            cursor: pointer;
        }

        .btn-dev:hover {
            background: #fff;
            color: #0a0b0c;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-links">
            <a href="index.html">ГЛАВНАЯ</a>
            <a href="events.html">ИВЕНТЫ</a>
            <a href="info.html">ИНФОРМАЦИЯ</a>
            <a href="#">СПРАВКА</a>
        </div>
        <div class="social-icons">
                        <!-- Placeholder for Telegram -->
            <a href="#"><img src="ic_baseline-telegram.png"></a>
            <!-- Placeholder for VK -->
            <a href="#"><img src="basil_vk-solid.png"></a>
            <!-- Placeholder for YouTube -->
            <a href="#"><img src="ic_baseline-discord.png"></a>
        </div>
    </header>

    <section class="hero">
        <div class="hero-overlay"></div>
        <div class="hero-content container">
            <h1>ИВЕНТЫ СЕРВЕРА TMF</h1>
            <p>КОНЕЦ, ПРЕДЛОЖИ СВОЙ КРУТОЙ ИВЕНТ<br>НЕ УПУСТИ ШАНС ПРОЯВИТЬ КРЕАТИВНОСТЬ И СДЕЛАТЬ ЧТО-ТО ОСОБЕННОЕ!</p>
            <!-- Кнопка для добавления карточек -->
            <button class="btn-add-event" id="add-event-btn">СОЗДАТЬ ИВЕНТ</button>
        </div>
    </section>

    <section class="section-events container">
        <!-- Контейнер для карточек. Изначально он пуст! -->
        <div class="events-grid" id="events-grid"></div>
    </section>

    <footer>
        <div class="footer-text">
            Все права защищены<br>
            Создано от одобрения администрации сервера в<br>
            SCP: Containment Breach Multiplayer
        </div>
        <a href="#" class="btn-dev">РАЗРАБОТЧИКИ</a>
    </footer>

    <!-- JavaScript для кнопки -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const addBtn = document.getElementById('add-event-btn');
            const container = document.getElementById('events-grid');

            // Функция добавления карточки
            function addEventCard() {
                const card = document.createElement('div');
                card.className = 'event-card';
                
                card.innerHTML = `
                    <div>
                        <h3>ЗОМБИ АПОКАЛИПСИС</h3>
                        <p>Две команды — SCP-049 ("Чумной Доктор") и Class-D. Цель обеих сторон — выживание и побег из лаборатории. Спустя некоторое время прибывают отряды MTF, а позже — Повстанцы Хаоса.</p>
                    </div>
                    <div class="card-footer">
                        <span>СОЗДАТЕЛЬ: chipa1no</span>
                        <span>ПО ЧЕТВЕРГАМ - 10:30 - 11:00 ПО МСК</span>
                    </div>
                `;
                
                // Вставляем карточку в конец списка
                container.appendChild(card);
            }

            // Обработчик клика по кнопке
            addBtn.addEventListener('click', addEventCard);
        });
    </script>

</body>
</html>
